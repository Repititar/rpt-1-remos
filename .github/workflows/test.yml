name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify project files
        run: |
          pwd
          ls -la
          test -f pyproject.toml || {
            echo "::error::pyproject.toml is missing from the repository root."
            exit 1
          }
          test -d src/repititar || {
            echo "::error::src/repititar directory is missing."
            exit 1
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Check code quality
        run: |
          ruff check .

      - name: Run tests
        run: |
          python -m pytest -v